[workspace]
resolver = "3"
members = [
    "crates/ruse-ansi",
    "crates/ruse-harmonica",
    "crates/ruse-colorprofile",
    "crates/ruse-style",
    "crates/ruse-runtime",
    "crates/ruse-components",
    "crates/ruse-glamour",
    "crates/ruse",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ruse-ansi = { path = "crates/ruse-ansi" }
ruse-colorprofile = { path = "crates/ruse-colorprofile" }
ruse-harmonica = { path = "crates/ruse-harmonica" }
ruse-style = { path = "crates/ruse-style" }
ruse-runtime = { path = "crates/ruse-runtime" }
ruse-components = { path = "crates/ruse-components" }
ruse-glamour = { path = "crates/ruse-glamour" }
ruse = { path = "crates/ruse" }

unicode-width = "0.2"
unicode-segmentation = "1.12"
bitflags = "2"
palette = "0.7"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
thiserror = "2"
pulldown-cmark = { version = "0.12", features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
